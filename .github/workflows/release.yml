name: Release

on:
  push:
    branches:
      - master
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Serialize attempts for the same release without dropping pending runs for other commits.
concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref || github.sha }}
  cancel-in-progress: false

jobs:
  build_and_release:
    name: Build and publish release
    if: github.ref_type == 'tag' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.build_meta.outputs.version }}
      publish_docker: ${{ steps.build_meta.outputs.publish_docker }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Resolve release version
        id: build_meta
        env:
          PUBLISH_DOCKER: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --verify HEAD)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            commit_date="$(git show -s --format=%cs "$commit")"
            version="v${commit_date//-/.}-${commit:0:12}"
          fi
          if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            printf 'Invalid release version: %s\n' "$version" >&2
            exit 1
          fi
          if existing_commit="$(git rev-parse --verify -q "refs/tags/${version}^{commit}")" &&
             [[ "$existing_commit" != "$commit" ]]; then
            printf 'Release tag %s already points to a different commit.\n' "$version" >&2
            exit 1
          fi
          printf 'version=%s\ncommit=%s\npublish_docker=%s\n' \
            "$version" "$commit" "$PUBLISH_DOCKER" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and package frontend and backend
        env:
          VERSION: ${{ steps.build_meta.outputs.version }}
          VITE_DATA_DRIVER: http
          VITE_API_BASE_URL: /api
        run: make package VERSION="$VERSION"

      - name: Publish tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSH_BEFORE: ${{ github.event.before }}
          VERSION: ${{ steps.build_meta.outputs.version }}
          BUILD_COMMIT: ${{ steps.build_meta.outputs.commit }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            if ! git show-ref --verify --quiet "refs/tags/$VERSION"; then
              git tag -- "$VERSION" "$BUILD_COMMIT"
            fi
            GIT_TERMINAL_PROMPT=0 git -c credential.helper='!gh auth git-credential' \
              push origin "refs/tags/$VERSION:refs/tags/$VERSION"
          fi

          if is_draft="$(gh release view "$VERSION" --json isDraft --jq .isDraft)"; then
            if [[ "$is_draft" == false ]]; then
              printf 'Release %s is already published.\n' "$VERSION"
              exit 0
            fi
          else
            bash scripts/release-notes.sh "$BUILD_COMMIT" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$PUSH_BEFORE" \
              > release/release-notes.md
            gh release create "$VERSION" --verify-tag --draft --title "$VERSION" \
              --notes-file release/release-notes.md
          fi

          gh release upload "$VERSION" --clobber \
            release/bugodoc-server-linux-amd64 \
            "release/bugodoc-server-linux-amd64-$VERSION.tar.gz" \
            "release/bugodoc-web-$VERSION.tar.gz" \
            "release/build-metadata-$VERSION.txt" \
            "release/checksums-$VERSION.txt"

          latest=false
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            latest=true
          elif [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            branch_tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)"
            if [[ "$branch_tip" == "$BUILD_COMMIT" ]]; then
              latest=true
            fi
          fi
          gh release edit "$VERSION" --verify-tag --draft=false --latest="$latest"

  docker_publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: build_and_release
    if: needs.build_and_release.outputs.publish_docker == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve image name
        id: image
        env:
          DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          repo="${DOCKERHUB_REPOSITORY:-$DOCKERHUB_USERNAME/plaindoc}"
          printf 'name=%s\n' "$repo" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          labels: org.opencontainers.image.title=bugodoc
          tags: |
            type=raw,value=${{ needs.build_and_release.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_DATA_DRIVER=http
            VITE_API_BASE_URL=/api
            VITE_BUILD_VERSION=${{ needs.build_and_release.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
